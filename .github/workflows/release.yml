name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
      - uses: pnpm/action-setup@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec changeset status
      - run: pnpm build
      - run: pnpm --filter dojofoo test:package

      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0; CLI v2
        with:
          publish: pnpm release
          version: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Emits Sigstore provenance attestation on every npm publish from CI.
          # Existing packages use their npm Trusted Publisher configuration.
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify published CLI
        run: |
          release_version=$(node -p 'require("./packages/cli/package.json").version')
          npm exec --yes --package="dojofoo@$release_version" -- dojofoo --help
