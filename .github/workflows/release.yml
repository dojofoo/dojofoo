name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter dojocho test:package

      - uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only to bootstrap packages that do not yet exist on npm.
          # Existing packages continue to use trusted publishing when absent.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Emits Sigstore provenance attestation on every npm publish from CI.
          # Existing packages use their npm Trusted Publisher configuration.
          NPM_CONFIG_PROVENANCE: "true"
