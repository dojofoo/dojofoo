name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # The website's release is its version tag: when a Version Packages merge bumps @dojofoo/web, the commit that set the
  # version is promoted to dojo.foo (its staged build), then tagged @dojofoo/web@<version>. Production follows only these
  # tags, so Vercel's rollback to the previous production deployment is the previous tag. Independent of the npm publish:
  # a failed promote leaves the tag out and the next push to main retries it, on the same commit.
  web:
    name: Web release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(node -p 'require("./apps/web/package.json").version')
          tag="@dojofoo/web@$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is released"
            exit 0
          fi
          # The commit that set the version (the Version Packages merge), not whatever main points at now
          commit=$(git log -1 --format=%H -G'"version":' -- apps/web/package.json)
          echo "Releasing $tag from $commit"
          { echo "tag=$tag"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.version.outputs.tag
        with:
          node-version: 24
      - name: Promote the release to production
        if: steps.version.outputs.tag
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/vercel/promote-release.mjs "${{ steps.version.outputs.commit }}"
      - name: Tag the release
        if: steps.version.outputs.tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          git tag "$TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false
      - uses: pnpm/action-setup@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec changeset status
      - run: pnpm build
      - run: pnpm --filter dojofoo test:package

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          publish-script: pnpm release
          version-script: pnpm run version
        env:
          # Emits Sigstore provenance attestation on every npm publish from CI.
          # Existing packages use their npm Trusted Publisher configuration.
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify published CLI
        if: contains(fromJSON(steps.changesets.outputs.published-packages).*.name, 'dojofoo')
        run: |
          release_version=$(node -p 'require("./packages/cli/package.json").version')
          npm exec --yes --package="dojofoo@$release_version" -- dojofoo --help

