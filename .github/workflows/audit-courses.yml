name: Audit courses

# Cisco AI Defense's skill-scanner over course versions it hasn't audited yet (apps/api/scripts/audit-courses.ts).
# Dojo's own checks run in the API when a course registers; this adds the scanner's beside them. No scanner key needed.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Until the database secrets are set the scheduled run has nothing to audit; it passes instead of failing
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - run: pnpm install --frozen-lockfile --filter @dojofoo/api
      - run: bun scripts/audit-courses.ts
        if: env.DATABASE_URL != ''
        working-directory: apps/api
