name: Verify

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false
      - uses: pnpm/action-setup@v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Version PRs consume their changesets; compare with HEAD so no new release note is required.
      - run: pnpm exec changeset status --since=origin/main
        if: github.head_ref != 'changeset-release/main'
      - run: pnpm exec changeset status --since=HEAD
        if: github.head_ref == 'changeset-release/main'
      # The fast checks only, in parallel (scripts/check.mjs, also the pre-push hook). Agent runs, conformance and the
      # browser suites run nightly for the packages that changed (nightly.yml).
      - run: pnpm build:check
      - run: pnpm check

